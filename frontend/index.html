<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview - Hassan (D-ID Video)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen py-8">
    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">AI Mock Interview</h1>
            <p class="text-gray-600">Practice your interview skills with AI-powered feedback and realistic facial animation</p>
        </div>

        <!-- Main Content Area - Contains Setup, Interview, and Avatar -->
        <div class="grid md:grid-cols-2 gap-8 mb-8">
            <!-- Setup Area (will be hidden after start) -->
            <div id="setupArea" class="space-y-4">
                <div>
                    <label for="jobTitleInput" class="block text-gray-700 text-sm font-bold mb-2">Target Job Title:</label>
                    <input type="text" id="jobTitleInput" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                           placeholder="e.g., Software Engineer">
                </div>
                
                <div>
                    <label for="companyInput" class="block text-gray-700 text-sm font-bold mb-2">Target Company:</label>
                    <input type="text" id="companyInput" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                           placeholder="e.g., Google, Microsoft, Meta">
                </div>

                <div class="flex items-center space-x-2">
                    <label class="text-sm text-gray-600">Speech Rate (AI Interviewer):</label>
                    <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="1" class="flex-1">
                    <span id="speechRateValue" class="text-sm text-gray-600">1.0</span>
                </div>

                <button id="startButton" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                    Start Interview
                </button>
            </div>

            <!-- D-ID Avatar Display - MOVED OUTSIDE setupArea -->
            <div id="avatarDisplayArea" class="text-center relative bg-gray-900 rounded-lg shadow-inner overflow-hidden flex flex-col items-center justify-center" style="height: 400px;">
                <h3 class="text-lg font-semibold mb-4 text-gray-200 absolute top-4">Your AI Interviewer</h3>
                
                <!-- D-ID Video Element - RESTORED ORIGINAL STYLES -->
                <video id="hassanVideo" autoplay playsinline muted loop class="w-full h-full object-contain hidden"></video>
                
                <!-- Placeholder when video is not ready -->
                <div id="hassanPlaceholder" class="text-gray-400 flex flex-col items-center justify-center p-4 w-full h-full">
                    <svg class="w-24 h-24 text-gray-600" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-4 4 4 4-4V5h-2a1 1 0 100 2h2v3l-4 4-4-4-4 4z" clip-rule="evenodd"></path></svg>
                    <p class="mt-4 text-lg">AI Interviewer will appear here.</p>
                </div>

                <!-- D-ID Connection Status -->
                <div id="hassanStatus" class="absolute bottom-2 left-2 bg-black bg-opacity-50 text-xs text-white px-2 py-1 rounded-md hidden">
                    Connecting...
                </div>
            </div>
        </div>

        <!-- Interview Area -->
        <div id="interviewArea" class="hidden">
            <div class="bg-gray-50 rounded-lg p-6 mb-6">
                <div id="questionDisplay" class="text-lg font-medium text-gray-800 mb-4"></div>
                
                <!-- Answer Input -->
                <div class="space-y-4">
                    <textarea id="answerInput" 
                              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none" 
                              rows="4" 
                              placeholder="Type your answer here or use voice input..."></textarea>
                    
                    <!-- Voice Controls -->
                    <div class="voice-controls">
                        <button id="micButton" 
                                class="speech-button bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition duration-200">
                            🎤 Start Recording
                        </button>
                        <button id="stopMicButton" 
                                class="hidden bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition duration-200">
                            ⏹️ Stop Recording
                        </button>
                        <span id="speechStatus" class="text-sm text-gray-600"></span>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="flex space-x-3">
                        <button id="answerButton" 
                                class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                            Submit Answer
                        </button>
                        <button id="nextButton" 
                                class="hidden bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                            Next Question
                        </button>
                        <button id="repeatQuestionButton" 
                                class="bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                            🔊 Repeat Question
                        </button>
                    </div>
                </div>
            </div>

            <!-- AI Feedback -->
            <div id="feedbackArea" class="bg-blue-50 rounded-lg p-6">
                <h4 class="text-lg font-semibold text-blue-800 mb-3">AI Feedback</h4>
                <div id="aiFeedback" class="text-gray-700 italic">Your feedback will appear here...</div>
            </div>
        </div>

        <!-- Loading and Error States -->
        <div id="loadingIndicator" class="hidden text-center py-8">
            <div class="inline-flex items-center space-x-3">
                <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
                <span class="text-gray-600">Processing...</span>
            </div>
        </div>
        
        <div id="errorDisplay" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
